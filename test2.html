<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HourCheck - Registro de Docente</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    /* ==========================================
       ESTILOS GENERALES Y LAYOUT RESPONSIVO
       ========================================== */
    body, html {
      min-height: 100vh;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
    }

    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .layout-wrapper {
      display: flex;
      width: 100%;
      max-width: 1100px;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    /* SECCIÓN MARCA / IZQUIERDA */
    .brand-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .main-title {
      font-size: 3.2rem;
      font-weight: 800;
      color: #000000;
      line-height: 1.1;
      margin: 20px 0 30px 0;
    }

    .brand-logo-img {
      width: 100%;
      max-width: 260px;
      height: auto;
      object-fit: contain;
    }

    /* SECCIÓN FORMULARIO / DERECHA */
    .card-section {
      flex: 1.1;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .register-card {
      background: #ffffff;
      border-radius: 35px;
      padding: 40px 45px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06), 0 5px 15px rgba(0, 0, 0, 0.04);
    }

    .header-row {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 15px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 2px solid #000000;
      border-radius: 50%;
      color: #000000;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.2s;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .btn-back:hover {
      background-color: #f0f0f0;
      transform: scale(1.05);
    }

    .btn-back i { font-size: 24px; }

    .flex-grow-input { flex-grow: 1; }

    .input-label {
      font-weight: 700;
      color: #000000;
      font-size: 1.05rem;
      margin-bottom: 6px;
      display: block;
    }

    .custom-input, .custom-select {
      background-color: #ffffff !important;
      border: 1.5px solid #e0e0e0 !important;
      border-radius: 20px !important;
      height: 48px !important;
      padding: 0 18px !important;
      box-sizing: border-box !important;
      font-size: 0.95rem !important;
      color: #333333 !important;
      margin-bottom: 16px !important;
      box-shadow: none !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
      width: 100% !important;
    }

    .custom-select { display: block !important; outline: none; }
    .custom-input::placeholder { color: #cccccc; }

    .custom-input:focus, .custom-select:focus {
      border-color: #ff5500 !important;
      box-shadow: 0 0 0 2px rgba(255, 85, 0, 0.15) !important;
    }

    .btn-orange-submit {
      background-color: #ff5500 !important;
      color: #ffffff !important;
      font-size: 1.2rem !important;
      font-weight: 700 !important;
      text-transform: none !important;
      border-radius: 30px !important;
      height: 52px !important;
      line-height: 52px !important;
      width: 100% !important;
      box-shadow: 0 4px 14px rgba(255, 85, 0, 0.3) !important;
      transition: background-color 0.2s, transform 0.1s !important;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-orange-submit:hover { background-color: #e64d00 !important; }
    .btn-orange-submit:disabled { background-color: #ffaa80 !important; cursor: not-allowed; }

    #boton-position {
      text-align: left;
      width: 100%;
      align-self: flex-start;
    }

      /* ==========================================
       FOOTER INTEGRADO (OSCURO SLATE)
       ========================================== */
    .hourcheck-footer {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 36px 20px 20px 20px;
      border-top: 1px solid #1e293b;
      margin-top: auto;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      align-items: center;
    }

    .footer-logo {
      display: flex;
      align-items: center;
    }

    .footer-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .footer-description {
      color: #94a3b8;
      font-size: 0.88rem;
      margin: 12px 0 0 0;
      line-height: 1.5;
      max-width: 480px;
    }

    .footer-action-col {
      display: flex;
      justify-content: flex-end;
    }

    .footer-support-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1e293b;
      color: #38bdf8;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid #334155;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .footer-support-btn:hover {
      background-color: #334155;
      border-color: #475569;
      color: #ffffff;
    }

    .footer-bottom {
      border-top: 1px solid #1e293b;
      margin-top: 28px;
      padding-top: 16px;
      text-align: center;
      font-size: 0.82rem;
      color: #64748b;
    }

    .footer-bottom p {
      margin: 0;
    }


    /* ==========================================
       MEDIA QUERIES PARA ADAPTABILIDAD RESPONSIVA
       ========================================== */
    @media (max-width: 900px) {
      .main-container {
        padding: 20px 15px;
      }

      .layout-wrapper {
        flex-direction: column;
        gap: 30px;
      }

      .main-title {
        font-size: 2.2rem;
        margin: 15px 0;
      }

      .brand-logo-img {
        max-width: 160px;
      }

      .register-card {
        padding: 25px 20px;
        border-radius: 25px;
      }

      .btn-orange-submit {
        font-size: 1.1rem !important;
      }
    }

    @media (max-width: 600px) {
      .footer-brand {
        justify-content: center;
      }

      .center-on-small {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="layout-wrapper">
      <div class="brand-section">
        <div id="boton-position"> 
          <a href="loginU.html?perfil=maestro" class="btn-back waves-effect waves-light" title="Volver">
            <i class="material-icons">arrow_back</i>
          </a>
        </div>
        <h1 class="main-title">Registro de<br>Docente</h1>
        <img src="Transparente (1).png" alt="HourCheck Logo" class="brand-logo-img">
      </div>

      <div class="card-section">
        <div class="register-card">
          <form id="teacherForm" autocomplete="off">
            <input type="hidden" id="tipoUsuario" name="tipo_usuario" value="docente">

            <div class="header-row">
              <div class="flex-grow-input">
                <label for="nombre" class="input-label">Nombre del docente</label>
                <input type="text" id="nombre" class="custom-input" placeholder="Ingresa tu nombre completo" required>
              </div>
            </div>

            <div>
              <label for="institucion" class="input-label">Institución</label>
              <select id="institucion" class="custom-select" required>
                <option value="" disabled selected hidden>Cargando instituciones...</option>
              </select>
            </div>

            <div>
              <label for="correo" class="input-label">Correo electrónico</label>
              <input type="email" id="correo" class="custom-input" placeholder="Ingresa tu correo" required autocomplete="email">
            </div>

            <div>
              <label for="password" class="input-label">Contraseña</label>
              <input type="password" id="password" class="custom-input" placeholder="Ingresa tu contraseña" required autocomplete="new-password">
            </div>

            <button type="submit" id="btnRegistrar" class="btn btn-orange-submit waves-effect waves-light">
              Registrarse
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

 <!-- Footer HourCheck (Oscuro Slate) -->
  <footer class="hourcheck-footer">
    <div class="footer-container">
      <div class="footer-grid">
        <div class="footer-brand-col">
          <div class="footer-logo">
            <img src="logo.png" alt="HourCheck Logo" class="footer-logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/140x40?text=HourCheck';">
          </div>
          <p class="footer-description">
            Plataforma web para el registro, gestión y validación transparente del Servicio Social Estudiantil.
          </p>
        </div>

        <div class="footer-action-col">
          <a href="mailto:soporte@hourcheck.com" class="footer-support-btn">
            <i class="material-icons">mail</i>
            <span>Contactar a soporte</span>
          </a>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; 2026 HourCheck. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAPNHT5Ot5gJpi6y65yrSNwOu9ESYQF4II",
      authDomain: "hourcheckt.firebaseapp.com",
      projectId: "hourcheckt",
      storageBucket: "hourcheckt.firebasestorage.app",
      messagingSenderId: "83459752453",
      appId: "1:83459752453:web:1b81724c28973bf567126c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const teacherForm = document.getElementById("teacherForm");
    const btnRegistrar = document.getElementById("btnRegistrar");

    // Función para Cargar Instituciones desde Firestore
    async function cargarInstituciones() {
      const selectInstitucion = document.getElementById("institucion");

      try {
        const querySnapshot = await getDocs(collection(db, "Institucion"));
        
        if (querySnapshot.empty) {
          selectInstitucion.innerHTML = '<option value="" disabled selected hidden>No hay instituciones registradas</option>';
          return;
        }

        selectInstitucion.innerHTML = '<option value="" disabled selected hidden>Selecciona una opción</option>';

        querySnapshot.forEach((docSnapshot) => {
          const data = docSnapshot.data();
          if (data.NameInst) {
            const option = document.createElement("option");
            
            option.value = docSnapshot.id; 
            option.textContent = data.NameInst;
            
            selectInstitucion.appendChild(option);
          }
        });

      } catch (error) {
        console.error("Error al cargar instituciones:", error);
        M.toast({ html: 'Error al cargar instituciones: ' + error.message, classes: 'red rounded' });
        selectInstitucion.innerHTML = '<option value="" disabled selected hidden>Error de permisos al cargar</option>';
      }
    }

    // Cargar opciones al iniciar
    cargarInstituciones();

    // Evento de Envío de Formulario
    teacherForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      btnRegistrar.disabled = true;
      btnRegistrar.textContent = "Registrando...";

      const nombreDocente = document.getElementById("nombre").value.trim();
      const institucionId = document.getElementById("institucion").value;
      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        // 1. Crear usuario en Auth
        const userCredential = await createUserWithEmailAndPassword(auth, correo, password);
        const uid = userCredential.user.uid;

        // 2. Guardar datos en la colección Docentes
        await setDoc(doc(db, "Docentes", uid), {
          Correo: correo,
          Institucion: institucionId,
          NameDocente: nombreDocente,
          fechaRegistro: new Date(),
          password: password,
          rol: "Docente"
        });

        M.toast({html: 'Docente registrado exitosamente. Redirigiendo...', classes: 'green rounded'});
        setTimeout(() => {
          window.location.href = "loginU.html?perfil=maestro";
        }, 1500);

      } catch (error) {
        console.error("Error al registrar docente:", error);
        let mensaje = error.message;
        if (error.code === 'auth/email-already-in-use') {
          mensaje = "Este correo ya está registrado.";
        } else if (error.code === 'auth/weak-password') {
          mensaje = "La contraseña debe tener al menos 6 caracteres.";
        }
        M.toast({html: 'Error: ' + mensaje, classes: 'red rounded'});
        btnRegistrar.disabled = false;
        btnRegistrar.textContent = "Registrarse";
      }
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
