<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Horas Sociales</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

  <div class="container" style="margin-top: 30px;">
    <div class="row">
      <div class="col s12 m10 offset-m1 l8 offset-l2">
        <div class="card-panel z-depth-2">
          <h4 class="center-align blue-text text-darken-2">Registro de Horas Sociales</h4>
          
          <form action="#" method="POST" enctype="multipart/form-data">
            
            <div class="row">
              <div class="input-field col s12">
                <i class="material-icons prefix">location_on</i>
                <input id="lugar" type="text" class="validate" required>
                <label for="lugar">Lugar donde se realizó</label>
              </div>
            </div>

            <div class="row">
              <div class="input-field col s12">
                <i class="material-icons prefix">person</i>
                <input id="docente" type="text" class="validate" required>
                <label for="docente">Docente encargado</label>
              </div>
            </div>

            <div class="row">
              <div class="input-field col s12">
                <i class="material-icons prefix">access_time</i>
                <input id="horas" type="number" min="1" step="0.5" class="validate" required>
                <label for="horas">Horas realizadas</label>
                <span class="helper-text" data-error="Ingresa un número válido de horas"></span>
              </div>
            </div>

            <div class="row">
              <div class="input-field col s12">
                <i class="material-icons prefix">description</i>
                <textarea id="descripcion" class="materialize-textarea" required></textarea>
                <label for="descripcion">Descripción de las actividades</label>
              </div>
            </div>

            <div class="row">
              <div class="file-field input-field col s12">
                <div class="btn blue darken-1">
                  <span>Evidencia</span>
                  <input type="file" id="evidencia" accept="image/*,.pdf" required>
                </div>
                <div class="file-path-wrapper">
                  <input class="file-path validate" type="text" placeholder="Adjuntar archivo (PDF o imagen)">
                </div>
              </div>
            </div>

            <div class="row center-align" style="margin-top: 20px;">
              <button class="btn waves-effect waves-light blue darken-2 btn-large" type="submit" name="action">
                Guardar Registro
                <i class="material-icons right">send</i>
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Inicialización de etiquetas activas y autogrow del textarea
      M.updateTextFields();
    });
  </script>
</body>
</html>
