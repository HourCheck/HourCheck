<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Institución</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
    }
    .main-container {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .layout-wrapper {
      display: flex;
      width: 100%;
      max-width: 1100px;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }
    .brand-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .main-title {
      font-size: 3.2rem;
      font-weight: 800;
      color: #000000;
      line-height: 1.1;
      margin-bottom: 30px;
    }
    .brand-logo-img {
      width: 260px;
      height: auto;
      object-fit: contain;
    }
    .card-section {
      flex: 1.1;
      display: flex;
      justify-content: center;
    }
    .register-card {
      background: #ffffff;
      border-radius: 35px;
      padding: 40px 45px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06), 0 5px 15px rgba(0, 0, 0, 0.04);
    }
    .header-row {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 15px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 2px solid #000000;
      border-radius: 50%;
      color: #000000;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.2s;
      flex-shrink: 0;
      margin-top: 5px;
    }
    .btn-back:hover { background-color: #f0f0f0; transform: scale(1.05); }
    .btn-back i { font-size: 24px; }
    .flex-grow-input { flex-grow: 1; }
    .input-label {
      font-weight: 700;
      color: #000000;
      font-size: 1.05rem;
      margin-bottom: 6px;
      display: block;
    }
    .custom-input {
      background-color: #ffffff !important;
      border: 1.5px solid #e0e0e0 !important;
      border-radius: 20px !important;
      height: 44px !important;
      padding: 0 18px !important;
      box-sizing: border-box !important;
      font-size: 0.95rem !important;
      color: #333333 !important;
      margin-bottom: 16px !important;
      box-shadow: none !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }
    .custom-input::placeholder { color: #cccccc; }
    .custom-input:focus {
      border-color: #ff5500 !important;
      box-shadow: 0 0 0 2px rgba(255, 85, 0, 0.15) !important;
    }
    .btn-orange-submit {
      background-color: #ff5500 !important;
      color: #ffffff !important;
      font-size: 1.3rem !important;
      font-weight: 700 !important;
      text-transform: none !important;
      border-radius: 30px !important;
      height: 52px !important;
      line-height: 52px !important;
      width: 100% !important;
      box-shadow: 0 4px 14px rgba(255, 85, 0, 0.3) !important;
      transition: background-color 0.2s, transform 0.1s !important;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-orange-submit:hover { background-color: #e64d00 !important; }
    .btn-orange-submit:disabled { background-color: #ffaa80 !important; cursor: not-allowed; }

    @media (max-width: 900px) {
      .layout-wrapper { flex-direction: column; gap: 25px; }
      .main-title { font-size: 2.3rem; margin-bottom: 15px; }
      .brand-logo-img { width: 160px; }
      .register-card { padding: 30px 25px; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="layout-wrapper">
      <div class="brand-section">
        <h1 class="main-title">Registro de<br>Institución</h1>
        <img src="Transparente (1).png" alt="HourCheck Logo" class="brand-logo-img">
      </div>

      <div class="card-section">
        <div class="register-card">
          <form id="institutionForm" autocomplete="off">
            <input type="hidden" id="tipoUsuario" name="tipo_usuario" value="institucion">

            <div class="header-row">
              <a href="loginU.html?perfil=institucion" class="btn-back waves-effect waves-light" title="Volver">
                <i class="material-icons">arrow_back</i>
              </a>
              <div class="flex-grow-input">
                <label for="nombreInstitucion" class="input-label">Nombre de la institución</label>
                <input type="text" id="nombreInstitucion" class="custom-input" placeholder="ej. Ofelia Herrera" required>
              </div>
            </div>

            <div>
              <label for="codigoInstitucion" class="input-label">Codigo institución</label>
              <input type="text" id="codigoInstitucion" class="custom-input" placeholder="ej. 1382" required>
            </div>

            <div>
              <label for="nombreDirector" class="input-label">Nombre del director</label>
              <input type="text" id="nombreDirector" class="custom-input" placeholder="ej. Juan Perez" required>
            </div>

            <div>
              <label for="correo" class="input-label">Correo</label>
              <input type="email" id="correo" class="custom-input" placeholder="Ingresa tu correo" required>
            </div>

            <div>
              <label for="password" class="input-label">Contraseña</label>
              <input type="password" id="password" class="custom-input" placeholder="Crea tu contraseña" required autocomplete="new-password">
            </div>

            <button type="submit" id="btnRegistrar" class="btn btn-orange-submit waves-effect waves-light">
              Registrarse
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAPNHT5Ot5gJpi6y65yrSNwOu9ESYQF4II",
      authDomain: "hourcheckt.firebaseapp.com",
      projectId: "hourcheckt",
      storageBucket: "hourcheckt.firebasestorage.app",
      messagingSenderId: "83459752453",
      appId: "1:83459752453:web:1b81724c28973bf567126c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const registroForm = document.getElementById("institutionForm");
    const btnRegistrar = document.getElementById("btnRegistrar");

    registroForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      btnRegistrar.disabled = true;
      btnRegistrar.textContent = "Registrando...";

      const nombreInstitucion = document.getElementById("nombreInstitucion").value.trim();
      const codigoInstitucion = document.getElementById("codigoInstitucion").value.trim();
      const nombreDirector = document.getElementById("nombreDirector").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        // 1. Crear la cuenta en Auth
        const userCredential = await createUserWithEmailAndPassword(auth, correo, password);
        const uid = userCredential.user.uid;

        // 2. Guardar en Firestore asociando el UID
        await setDoc(doc(db, "Institucion", uid), {
          CodigoInf: codigoInstitucion,
          CorreoInst: correo,
          NameDirector: nombreDirector,
          NameInst: nombreInstitucion,
          fechaRegistro: new Date()
        });

        M.toast({html: 'Institución registrada exitosamente. Redirigiendo...', classes: 'green rounded'});
        setTimeout(() => {
          window.location.href = "loginU.html?perfil=institucion";
        }, 1500);

      } catch (error) {
        console.error("Error al registrar institución:", error);
        let mensaje = error.message;
        if (error.code === 'auth/email-already-in-use') {
          mensaje = "Este correo ya está registrado.";
        } else if (error.code === 'auth/weak-password') {
          mensaje = "La contraseña debe tener al menos 6 caracteres.";
        }
        M.toast({html: 'Error: ' + mensaje, classes: 'red rounded'});
        btnRegistrar.disabled = false;
        btnRegistrar.textContent = "Registrarse";
      }
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
