<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HourCheck - Selecciona tu perfil</title>
  <link rel="icon" type="image/png" href="logo.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #ffffff;
    }

    .main-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar-blue {
      background-color: #0052cc;
      width: 120px;
      flex-shrink: 0;
    }

   
    .content-area {
      flex-grow: 1;
      padding: 40px 60px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

   
    .brand-logo-container {
      position: absolute;
      top: 40px;
      right: 60px;
      text-align: center;
    }

    .brand-logo-container img {
      width: 120px;
      height: auto;
      object-fit: contain;
    }

    /* Título principal */
    .main-title {
      font-weight: 700;
      color: #000;
      font-size: 2.8rem;
      margin-bottom: 50px;
    }

  
    .profile-card {
      background-color: #e0e0e0;
      border-radius: 25px;
      padding: 30px 20px 20px 20px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .profile-card:hover {
      transform: translateY(-5px);
      background-color: #d5d5d5;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .profile-card i {
      font-size: 70px;
      color: #0052cc;
      margin-bottom: 15px;
    }

    .profile-card span {
      font-weight: bold;
      color: #000;
      font-size: 1.1rem;
      display: block;
    }

    
    .help-text {
      margin-top: 60px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #000;
    }

    .help-text a {
      color: #448aff;
      text-decoration: none;
      margin-left: 8px;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .brand-logo-container {
        position: relative;
        top: 0;
        right: 0;
        margin-bottom: 20px;
      }
      .content-area {
        padding: 20px;
      }
      .main-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
  
    <div class="sidebar-blue hide-on-small-only"></div>

  
    <div class="content-area">
      
    
      <div class="brand-logo-container">
        <img src="logo1.png" alt="HourCheck Logo">
      </div>

      
      <h1 class="main-title center-align">Selecciona tu perfil</h1>

     
      <div class="container">
        <div class="row">
          
        
          <div class="col s12 m4">
            <a href="loginU.html?perfil=institucion" class="profile-card waves-effect waves-light width-100">
              <i class="material-icons">account_balance</i>
              <span>Instituciones</span>
            </a>
          </div>

        
          <div class="col s12 m4">
            <a href="loginU.html?perfil=maestro" class="profile-card waves-effect waves-light width-100">
              <i class="material-icons">collections_bookmark</i>
              <span>Maestros</span>
            </a>
          </div>

       
          <div class="col s12 m4">
            <a href="loginU.html?perfil=estudiante" class="profile-card waves-effect waves-light width-100">
              <i class="material-icons">school</i>
              <span>Estudiantes</span>
            </a>
          </div>

        </div>
      </div>

        
      <div class="help-text center-align">
        ¿No sabes cual es tu perfil? <a href="saberCualP.html">Has click aquí</a>
      </div>

    </div>
  </div>


  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAPNHT5Ot5gJpi6y65yrSNwOu9ESYQF4II",
      authDomain: "hourcheckt.firebaseapp.com",
      projectId: "hourcheckt",
      storageBucket: "hourcheckt.firebasestorage.app",
      messagingSenderId: "83459752453",
      appId: "1:83459752453:web:1b81724c28973bf567126c",
      measurementId: "G-95286SR8NZ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>

 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
