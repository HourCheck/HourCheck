<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hourcheck - login</title>
  <link rel="icon" type="image/png" href="logo.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
 
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
/* ==========================================
       FOOTER INTEGRADO - HOURCHECK (OSCURO SLATE)
       ========================================== */
    .hourcheck-footer {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 36px 20px 20px 20px;
      border-top: 1px solid #1e293b;
      margin-top: 50px;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      align-items: center;
    }

    .footer-logo {
      display: flex;
      align-items: center;
    }

    /* Estilo optimizado para la imagen del logo */
    .footer-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .footer-description {
      color: #94a3b8;
      font-size: 0.88rem;
      margin: 12px 0 0 0;
      line-height: 1.5;
      max-width: 480px;
    }

    .footer-action-col {
      display: flex;
      justify-content: flex-end;
    }

    .footer-support-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1e293b;
      color: #38bdf8;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid #334155;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .footer-support-btn:hover {
      background-color: #334155;
      border-color: #475569;
      color: #ffffff;
    }

    .footer-bottom {
      border-top: 1px solid #1e293b;
      margin-top: 28px;
      padding-top: 16px;
      text-align: center;
      font-size: 0.82rem;
      color: #64748b;
    }

    .footer-bottom p {
      margin: 0;
    }

    @media (max-width: 768px) {
      .footer-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .footer-action-col {
        justify-content: flex-start;
      }
    }

    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #ffffff;
    }

    .main-container {
      display: flex;
      min-height: 100vh;
    }


    .content-area {
      flex-grow: 1;
      padding: 40px 60px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand-logo-container {
      position: absolute;
      top: 40px;
      right: 60px;
      text-align: center;
    }

    .brand-logo-container img {
      width: 120px;
      height: auto;
      object-fit: contain;
    }

    .login-card {
      background: #ffffff;
      border-radius: 35px;
      padding: 45px 50px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12), 0 5px 15px rgba(0, 0, 0, 0.06);
      position: relative;
    }

    .login-header {
      display: flex;
      align-items: center;
      margin-bottom: 30px;
    }

    .btn-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 45px;
      border: 2px solid #000000;
      border-radius: 50%;
      color: #000000;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.2s;
      margin-right: 20px;
      flex-shrink: 0;
    }

    .btn-back:hover {
      background-color: #f0f0f0;
      transform: scale(1.05);
    }

    .btn-back i {
      font-size: 26px;
    }

    .login-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #000000;
      margin: 0;
    }

    .input-label {
      font-weight: 700;
      color: #000000;
      font-size: 1.1rem;
      margin-bottom: 8px;
      display: block;
    }

    .custom-input {
      background-color: #ffffff !important;
      border: 1.5px solid #dcdcdc !important;
      border-radius: 25px !important;
      height: 48px !important;
      padding: 0 20px !important;
      box-sizing: border-box !important;
      font-size: 0.95rem !important;
      color: #333333 !important;
      margin-bottom: 20px !important;
      box-shadow: none !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }

    .custom-input::placeholder {
      color: #b5b5b5;
    }

    .custom-input:focus {
      border-color: #ff5500 !important;
      box-shadow: 0 0 0 2px rgba(255, 85, 0, 0.2) !important;
    }

    .forgot-password-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .forgot-password-link {
      color: #448aff;
      font-weight: 500;
      font-size: 1.05rem;
      text-decoration: none;
    }

    .forgot-password-link:hover {
      text-decoration: underline;
    }

    .btn-login {
      background-color: #ff5500 !important;
      color: #ffffff !important;
      font-size: 1.3rem !important;
      font-weight: 700 !important;
      text-transform: none !important;
      border-radius: 30px !important;
      height: 55px !important;
      line-height: 55px !important;
      width: 100% !important;
      box-shadow: 0 4px 12px rgba(255, 85, 0, 0.3) !important;
      transition: background-color 0.2s, transform 0.1s !important;
      border: none;
      cursor: pointer;
    }

    .btn-login:hover {
      background-color: #e64d00 !important;
    }

    .register-container {
      text-align: center;
      margin-top: 25px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #000000;
    }

    .register-link {
      color: #448aff;
      text-decoration: none;
      margin-left: 5px;
    }

    .register-link:hover {
      text-decoration: underline;
    }

    .alert-msg {
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .alert-warning { background-color: #fff3cd; color: #856404; }
    .alert-danger { background-color: #f8d7da; color: #721c24; }

    @media (max-width: 600px) {
      .brand-logo-container {
        position: relative;
        top: 0;
        right: 0;
        margin-bottom: 20px;
      }
      .content-area {
        padding: 20px 15px;
        flex-direction: column;
      }
      .login-card {
        padding: 30px 20px;
        border-radius: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
   

    <div class="content-area">
      <div class="brand-logo-container">
        <img src="Transparente (1).png" alt="HourCheck Logo">
      </div>

      <div class="login-card">
        <div class="login-header">
          <a href="index.html" class="btn-back waves-effect waves-light" title="Volver a Perfiles">
            <i class="material-icons">arrow_back</i>
          </a>
          <h2 class="login-title">Inicio de sesión</h2>
        </div>

        <form id="loginForm">
          <div>
            <label for="correo" class="input-label">Correo Electrónico</label>
            <input id="correo" type="email" class="custom-input" placeholder="Ingresa tu correo" required autocomplete="email">
          </div>

          <div>
            <label for="password" class="input-label">Contraseña</label>
            <input id="password" type="password" class="custom-input" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
          </div>

          <div class="forgot-password-container">
            <a href="recucontra.html" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
          </div>

          <div id="mensaje"></div>

          <button type="submit" id="btnLogin" class="btn btn-login waves-effect waves-light">
            Iniciar sesión
          </button>

          <div class="register-container">
            ¿No tienes cuenta? <a href="#" id="linkRegistro" class="register-link">Regístrate aquí</a>
          </div>
        </form>
      </div>

    </div>
  </div>
<!-- Footer HourCheck (Opción 4: Oscuro Slate) -->
  <footer class="hourcheck-footer">
    <div class="footer-container">
      <div class="footer-grid">
        <div class="footer-brand-col">
          <div class="footer-logo">
            <img src="logo.png" alt="HourCheck Logo" class="footer-logo-img" onerror="this.onerror=null; this.src='https://via.placeholder.com/140x40?text=HourCheck';">
          </div>
          <p class="footer-description">
            Plataforma web para el registro, gestión y validación transparente del Servicio Social Estudiantil.
          </p>
        </div>

        <div class="footer-action-col">
          <a href="mailto:soporte@hourcheck.com" class="footer-support-btn">
            <i class="material-icons">mail</i>
            <span>Contactar Soporte</span>
          </a>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; 2026 HourCheck. Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAPNHT5Ot5gJpi6y65yrSNwOu9ESYQF4II",
      authDomain: "hourcheckt.firebaseapp.com",
      projectId: "hourcheckt",
      storageBucket: "hourcheckt.firebasestorage.app",
      messagingSenderId: "83459752453",
      appId: "1:83459752453:web:1b81724c28973bf567126c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const perfilActual = urlParams.get('perfil') || 'estudiante';

   
    const linkRegistro = document.getElementById('linkRegistro');
    if (linkRegistro) {
      const paginasRegistro = {
        'institucion': 'registro-institucion.html',
        'maestro': 'registro-maestro.html',
        'docente': 'registro-maestro.html',
        'estudiante': 'registro-estudiante.html'
      };
      linkRegistro.href = paginasRegistro[perfilActual] || 'registro-estudiante.html';
    }

  
    const mapaPerfil = {
      'estudiante': { coleccion: 'Estudiantes', destino: 'mainPE.html' },
      'maestro':    { coleccion: 'Docentes',    destino: 'mainPD.html' },
      'docente':    { coleccion: 'Docentes',    destino: 'mainPD.html' },
      'institucion':{ coleccion: 'Institucion', destino: 'mainPI.html' }
    };

   
    const loginForm = document.getElementById('loginForm');
    const btnLogin = document.getElementById('btnLogin');
    const mensajeDiv = document.getElementById('mensaje');

    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('correo')?.value.trim();
        const password = document.getElementById('password')?.value.trim();

        if (!email || !password) {
          mensajeDiv.innerHTML = '<div class="alert-msg alert-warning">Por favor, completa todos los campos</div>';
          return;
        }

        const configPerfil = mapaPerfil[perfilActual];
        if (!configPerfil) {
          mensajeDiv.innerHTML = '<div class="alert-msg alert-danger">Perfil no válido en la URL</div>';
          return;
        }

      
        btnLogin.disabled = true;
        btnLogin.textContent = "Verificando...";
        mensajeDiv.innerHTML = "";

        try {
          
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const uid = userCredential.user.uid;

          const docRefActual = doc(db, configPerfil.coleccion, uid);
          const docSnapActual = await getDoc(docRefActual);

          if (docSnapActual.exists()) {
          
            window.location.href = configPerfil.destino;
          } else {
           
            let perfilEncontrado = null;
            for (const key in mapaPerfil) {
              if (key === perfilActual) continue;
              const testDocRef = doc(db, mapaPerfil[key].coleccion, uid);
              const testSnap = await getDoc(testDocRef);
              if (testSnap.exists()) {
                perfilEncontrado = key;
                break;
              }
            }

            if (perfilEncontrado) {
              mensajeDiv.innerHTML = `<div class="alert-msg alert-warning">Esta cuenta pertenece al perfil de <strong>${perfilEncontrado.toUpperCase()}</strong>. Selecciona el perfil correcto.</div>`;
            } else {
              mensajeDiv.innerHTML = `<div class="alert-msg alert-danger">No se encontró información del perfil para esta cuenta.</div>`;
            }
          }

        } catch (error) {
          console.error("Error al iniciar sesión:", error);
          let errorText = "Correo o contraseña incorrectos.";
          if (error.code === 'auth/invalid-credential') {
            errorText = "Credenciales inválidas. Revisa tu correo y contraseña.";
          }
          mensajeDiv.innerHTML = `<div class="alert-msg alert-danger">${errorText}</div>`;
        } finally {
          btnLogin.disabled = false;
          btnLogin.textContent = "Iniciar sesión";
        }
      });
    }

  </script>

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
