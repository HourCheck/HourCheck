<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HourCheck</title>
  

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #ffffff;
    }

    .main-container {
      display: flex;
      min-height: 100vh;
    }

   
    .sidebar-blue {
      background-color: #0052cc;
      width: 120px;
      flex-shrink: 0;
    }

  
    .content-area {
      flex-grow: 1;
      padding: 40px 60px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

  
    .brand-logo-container {
      position: absolute;
      top: 40px;
      right: 60px;
      text-align: center;
    }

    .brand-logo-container img {
      width: 120px;
      height: auto;
      object-fit: contain;
    }

  
    .login-card {
      background: #ffffff;
      border-radius: 35px;
      padding: 45px 50px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12), 0 5px 15px rgba(0, 0, 0, 0.06);
      position: relative;
    }

   
    .login-header {
      display: flex;
      align-items: center;
      margin-bottom: 30px;
    }

    .btn-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 45px;
      border: 2px solid #000000;
      border-radius: 50%;
      color: #000000;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.2s;
      margin-right: 20px;
      flex-shrink: 0;
    }

    .btn-back:hover {
      background-color: #f0f0f0;
      transform: scale(1.05);
    }

    .btn-back i {
      font-size: 26px;
    }

    .login-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #000000;
      margin: 0;
    }

  
    .input-label {
      font-weight: 700;
      color: #000000;
      font-size: 1.1rem;
      margin-bottom: 8px;
      display: block;
    }

    .custom-input {
      background-color: #ffffff !important;
      border: 1.5px solid #dcdcdc !important;
      border-radius: 25px !important;
      height: 48px !important;
      padding: 0 20px !important;
      box-sizing: border-box !important;
      font-size: 0.95rem !important;
      color: #333333 !important;
      margin-bottom: 20px !important;
      box-shadow: none !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }

    .custom-input::placeholder {
      color: #b5b5b5;
    }

    .custom-input:focus {
      border-color: #ff5500 !important;
      box-shadow: 0 0 0 2px rgba(255, 85, 0, 0.2) !important;
    }

  
    .forgot-password-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .forgot-password-link {
      color: #448aff;
      font-weight: 500;
      font-size: 1.05rem;
      text-decoration: none;
    }

    .forgot-password-link:hover {
      text-decoration: underline;
    }

  
    .btn-login {
      background-color: #ff5500 !important;
      color: #ffffff !important;
      font-size: 1.3rem !important;
      font-weight: 700 !important;
      text-transform: none !important;
      border-radius: 30px !important;
      height: 55px !important;
      line-height: 55px !important;
      width: 100% !important;
      box-shadow: 0 4px 12px rgba(255, 85, 0, 0.3) !important;
      transition: background-color 0.2s, transform 0.1s !important;
      border: none;
      cursor: pointer;
    }

    .btn-login:hover {
      background-color: #e64d00 !important;
    }

    /* Enlace de registro */
    .register-container {
      text-align: center;
      margin-top: 25px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #000000;
    }

    .register-link {
      color: #448aff;
      text-decoration: none;
      margin-left: 5px;
    }

    .register-link:hover {
      text-decoration: underline;
    }

    
    .alert-msg {
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .alert-warning { background-color: #fff3cd; color: #856404; }
    .alert-danger { background-color: #f8d7da; color: #721c24; }

    @media (max-width: 600px) {
      .brand-logo-container {
        position: relative;
        top: 0;
        right: 0;
        margin-bottom: 20px;
      }
      .content-area {
        padding: 20px 15px;
        flex-direction: column;
      }
      .login-card {
        padding: 30px 20px;
        border-radius: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
   
    <div class="sidebar-blue hide-on-small-only"></div>

  
    <div class="content-area">
      
      
      <div class="brand-logo-container">
        <img src="Transparente (1).png" alt="HourCheck Logo">
      </div>

    
      <div class="login-card">
        
       
        <div class="login-header">
          <a href="index.html" class="btn-back waves-effect waves-light" title="Volver">
            <i class="material-icons">arrow_back</i>
          </a>
          <h2 class="login-title">Inicio de sesión</h2>
        </div>

      
        <form id="loginForm">
          
          
          <div>
            <label for="correo" class="input-label">Correo Electrónico</label>
            <input id="correo" type="email" class="custom-input" placeholder="Ingresa tu correo" required autocomplete="email">
          </div>

      
          <div>
            <label for="password" class="input-label">Contraseña</label>
            <input id="password" type="password" class="custom-input" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
          </div>

          
          <div class="forgot-password-container">
            <a href="#" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
          </div>

      
          <div id="mensaje"></div>

          <button type="submit" class="btn btn-login waves-effect waves-light">
            Iniciar sesión
          </button>

         
          <div class="register-container">
            ¿No tienes cuenta? <a href="#" id="linkRegistro" class="register-link">Regístrate aquí</a>
          </div>

        </form>
      </div>

    </div>
  </div>

 <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAPNHT5Ot5gJpi6y65yrSNwOu9ESYQF4II",
    authDomain: "hourcheckt.firebaseapp.com",
    projectId: "hourcheckt",
    storageBucket: "hourcheckt.firebasestorage.app",
    messagingSenderId: "83459752453",
    appId: "1:83459752453:web:1b81724c28973bf567126c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 1. Obtener el parámetro 'perfil' de la URL (ej: login.html?perfil=estudiante)
  const urlParams = new URLSearchParams(window.location.search);
  const perfil = urlParams.get('perfil') || 'estudiante'; // Por defecto 'estudiante'

  // 2. Configurar el enlace de registro según el perfil
  const linkRegistro = document.getElementById('linkRegistro');
  if (linkRegistro) {
    const paginasRegistro = {
      'institucion': 'registro-institucion.html',
      'maestro': 'registro-maestro.html',
      'docente': 'registro-maestro.html',
      'estudiante': 'registro-estudiante.html'
    };
    linkRegistro.href = paginasRegistro[perfil] || 'registro-estudiante.html';
  }

  // Mapeo entre el 'perfil' de la URL, la Colección de Firestore y la Página Principal
  const mapaPerfil = {
    'estudiante': {
      coleccion: 'Estudiantes',
      destino: 'mainPE.php'
    },
    'maestro': {
      coleccion: 'Docentes',
      destino: 'mainPD.php'
    },
    'docente': {
      coleccion: 'Docentes',
      destino: 'mainPD.php'
    },
    'institucion': {
      coleccion: 'Institucion',
      destino: 'mainPI.php'
    }
  };

  // 3. Manejo del inicio de sesión
  const loginForm = document.getElementById('loginForm');

  if (loginForm) {
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('correo')?.value.trim();
      const password = document.getElementById('password')?.value.trim();
      const mensajeDiv = document.getElementById('mensaje');

      if (!email || !password) {
        if (mensajeDiv) mensajeDiv.innerHTML = '<div class="alert-msg alert-warning">Por favor, completa todos los campos</div>';
        return;
      }

      // Validar si el perfil especificado existe en nuestro mapeo
      const configPerfil = mapaPerfil[perfil];
      if (!configPerfil) {
        if (mensajeDiv) mensajeDiv.innerHTML = '<div class="alert-msg alert-danger">Perfil no válido en la URL</div>';
        return;
      }

      try {
        // 1. Autenticar en Firebase Auth
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // 2. Buscar ÚNICAMENTE en la colección correspondiente al perfil actual
        const userDocRef = doc(db, configPerfil.coleccion, uid);
        const userDoc = await getDoc(userDocRef);

        if (userDoc.exists()) {
          // 3. Si existe en esa colección, redirigir a su página principal
          window.location.href = configPerfil.destino;
        } else {
          // Si el usuario se autenticó pero no pertenece a esta colección especifica
          if (mensajeDiv) {
            mensajeDiv.innerHTML = `<div class="alert-msg alert-danger">Esta cuenta no pertenece al perfil de ${perfil.toUpperCase()}</div>`;
          }
        }

      } catch (error) {
        console.error("Error al iniciar sesión:", error);
        if (mensajeDiv) mensajeDiv.innerHTML = '<div class="alert-msg alert-danger">Correo o contraseña incorrectos</div>';
      }
    });
  }
</script>

 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
